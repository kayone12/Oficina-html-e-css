<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto front-end</title>
<!--css-->
<link rel="stylesheet" href="style.css">

</head>
<body>
    <!--Cabeçalho-->

    <header>
        <div class="apresentacao">
            
            <h1>Desenvolvedor Front-end</h1>
            <h4>Formulario para vaga de desenvolvedor</h4>

        </div>
    </header>

    <!--Conteudo principal-->
    <main id="principal">
        
        <section class="vaga">

            <div class="descricao">
                <img class="imagem" src="https://th.bing.com/th/id/OIP.iL4ahWI55hA4G_-fTUw5sAHaHa?w=188&h=188&c=7&r=0&o=5&pid=1.7" alt="incone front-end">
                <H2>Sobre a vaga</H2>
                <p>Estamos em busca de um desenvolvedor Front-end com experiencia em Html,Css e JavaScript</p>
            </div>

            <form class="formulario">
                <h3>Candidate-se a esta vaga</h3>
                <label for="nome"> Nome 
                </label>
                <input type="text" id="nome" placeholder="Digite seu nome">
                <label for="email"> E-mail</label>
                <input type="email" id="email" placeholder="Digite o seu email">
                
                <button type="enviar"> Enviar</button>

            </form>

        </section>

    </main>
    <!--rodapé-->
    
    <footer>
        <P>2025 - Todos os direitos reservados oficina Front-end</P>
    </footer>





</body>
</html>
